<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYCINE | Free Movies & Series</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --red: #e50914; --bg: #050505; --gray: #b3b3b3; --nav-bg: rgba(18, 18, 18, 0.98); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 90px; overflow-x: hidden; width: 100vw; }

        /* CINEBY UI COMPONENTS */
        .header { padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; position: absolute; top: 0; width: 100%; z-index: 1000; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .logo { font-weight: 900; font-size: 26px; color: var(--red); text-decoration: none; text-transform: uppercase; letter-spacing: -1px; }

        .search-area { padding: 75px 20px 10px; }
        .search-box { background: #1a1a1a; display: flex; align-items: center; padding: 12px 15px; border-radius: 10px; border: 1px solid #333; }
        .search-box input { background: none; border: none; color: white; width: 100%; outline: none; margin-left: 10px; font-size: 16px; }

        .section-header { padding: 25px 20px 15px; font-size: 19px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .section-header::before { content: ''; width: 4px; height: 18px; background: var(--red); border-radius: 2px; }

        .movie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 15px; }
        .movie-card { border-radius: 8px; overflow: hidden; transform: scale(1); transition: 0.3s; }
        .movie-card:active { transform: scale(0.95); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        /* PLAYER OVERLAY (Professional) */
        #player-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 9999; display: none; }
        .close-p { position: absolute; top: 20px; right: 20px; font-size: 32px; color: white; z-index: 10000; text-shadow: 0 0 10px black; padding: 5px; }
        iframe { width: 100%; height: 100%; border: none; }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--nav-bg); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #222; z-index: 5000; backdrop-filter: blur(15px); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--gray); font-size: 10px; cursor: pointer; }
        .nav-item.active { color: var(--red); }
        .nav-item i { font-size: 22px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div id="player-overlay">
        <i class="fa-solid fa-xmark close-p" onclick="closePlayer()"></i>
        <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
    </div>

    <div class="header">
        <a href="#" class="logo">MYCINE</a>
        <i class="fa-solid fa-circle-user" style="font-size: 24px;"></i>
    </div>

    <div class="search-area">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--gray);"></i>
            <input type="text" id="mainSearch" placeholder="Search movies or tv shows..." oninput="handleSearch()">
        </div>
    </div>

    <div class="section-header" id="list-label">Popular Content</div>
    <div id="movie-list" class="movie-grid"></div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="location.reload()"><i class="fa-solid fa-house"></i><span>Home</span></div>
        <div class="nav-item" onclick="alert('Join Telegram for Updates!')"><i class="fa-brands fa-telegram"></i><span>Telegram</span></div>
        <div class="nav-item"><i class="fa-solid fa-download"></i><span>Downloads</span></div>
    </div>

<script>
    const API_KEY = '8fb914f298b90c2e92d9cec6a1c3b08f';
    const W500 = 'https://image.tmdb.org/t/p/w500';
    
    // EARNING ENGINE
    let clicks = 0;
    const MY_AD_LINK = "https://www.google.com"; // Monetag link yahan aayega

    async function init() {
        const res = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${API_KEY}`);
        const data = await res.json();
        renderMovies(data.results);
    }

    function renderMovies(movies) {
        const list = document.getElementById('movie-list');
        list.innerHTML = movies.map(m => `
            <div class="movie-card" onclick="startMovie(${m.id}, '${m.media_type || 'movie'}')">
                <img src="${W500 + (m.poster_path || m.backdrop_path)}">
            </div>
        `).join('');
    }

    async function handleSearch() {
        const val = document.getElementById('mainSearch').value;
        if(val.length < 3) return;
        const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${val}`);
        const data = await res.json();
        document.getElementById('list-label').innerText = "Search Results";
        renderMovies(data.results);
    }

    // THE MAGIC PLAYER FUNCTION
    function startMovie(id, type) {
        clicks++;
        if(clicks <= 2) {
            window.open(MY_AD_LINK, '_blank');
            return;
        }

        const overlay = document.getElementById('player-overlay');
        const player = document.getElementById('videoPlayer');
        overlay.style.display = 'block';

        // Best Source for Mobile
        const source = type === 'tv' ? `https://vidsrc.xyz/embed/tv?tmdb=${id}` : `https://vidsrc.xyz/embed/movie?tmdb=${id}`;
        player.src = source;
    }

    function closePlayer() {
        document.getElementById('player-overlay').style.display = 'none';
        document.getElementById('videoPlayer').src = "";
        clicks = 0; // Reset ads for next watch
    }

    init();
</script>
</body>
  </html>
